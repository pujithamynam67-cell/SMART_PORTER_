<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Registration - Smart Porter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%); min-height: 100vh; }
        .reg-card { border-radius: 20px; border: none; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="text-center mb-4">
                    <a href="../index.html" class="text-decoration-none">
                        <div class="fs-3 fw-bold text-white">
                            <i class="fa-solid fa-cart-flatbed-suitcase text-warning me-2"></i>Smart<span class="text-warning">Porter</span>
                        </div>
                    </a>
                    <p class="text-white-50 small mt-1">Passenger Self-Service Onboarding</p>
                </div>
                <div class="card reg-card shadow-lg p-4">
                    <h4 class="fw-bold text-navy mb-1">Create Passenger Profile</h4>
                    <p class="text-muted small mb-4">Sign up to book luggage porters across 25+ railway stations</p>
                    
                    <form id="passRegisterForm">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-user text-muted"></i></span>
                                <input type="text" id="fullName" class="form-control" placeholder="e.g. Ramesh Kumar" required>
                            </div>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-bold text-muted">Mobile Number</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-phone text-muted"></i></span>
                                    <input type="tel" id="phone" class="form-control" placeholder="10 digits" pattern="[0-9]{10}" required>
                                </div>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-bold text-muted">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-envelope text-muted"></i></span>
                                    <input type="email" id="email" class="form-control" placeholder="name@email.com" required>
                                </div>
                            </div>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-bold text-muted">Gender</label>
                                <select id="gender" class="form-select">
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="col-6 d-flex align-items-center pt-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="isSeniorCitizen">
                                    <label class="form-check-label small fw-bold" for="isSeniorCitizen">
                                        Senior Citizen (15% Subsidy)
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="row g-2 mb-4">
                            <div class="col-6">
                                <label class="form-label small fw-bold text-muted">Password</label>
                                <input type="password" id="password" class="form-control" placeholder="Min 6 chars" required minlength="6">
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-bold text-muted">Confirm Password</label>
                                <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat password" required minlength="6">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-sp-orange w-100 py-2 mb-3 fw-bold shadow-sm" id="regBtn">
                            <i class="fa-solid fa-user-plus me-2"></i>Create Passenger Account
                        </button>
                    </form>
                    <div class="text-center small">
                        Already have an account? <a id="loginLink" href="login.html" class="text-warning fw-bold text-decoration-none">Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../assets/js/api.js?v=3"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const redirectParam = urlParams.get('redirect');
        if (redirectParam) {
            const loginLink = document.getElementById('loginLink');
            if (loginLink) loginLink.href = `login.html?redirect=${encodeURIComponent(redirectParam)}`;
        }

        document.getElementById('passRegisterForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pwd = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            if (pwd !== confirm) {
                showNotification('Passwords do not match. Please recheck.', 'danger');
                return;
            }
            const btn = document.getElementById('regBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Creating Profile...';

            try {
                const res = await API.registerPassenger({
                    fullName: document.getElementById('fullName').value.trim(),
                    phone: document.getElementById('phone').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    gender: document.getElementById('gender').value,
                    isSeniorCitizen: document.getElementById('isSeniorCitizen').checked,
                    password: pwd
                });
                const dest = redirectParam || '../passenger/dashboard.html';
                const destName = redirectParam ? 'Booking Portal' : 'Dashboard';
                showNotification(`Registration successful! Redirecting to ${destName}...`, 'success');
                localStorage.setItem('sp_user', JSON.stringify({ type: 'PASSENGER', data: res.data }));
                setTimeout(() => { window.location.href = dest; }, 800);
            } catch (err) {
                showNotification(err.message || 'Registration failed', 'danger');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-user-plus me-2"></i>Create Passenger Account';
            }
        });
    </script>
</body>
</html>
