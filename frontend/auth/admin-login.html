<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Smart Porter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; }
        .admin-card { border-radius: 20px; border: none; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="text-center mb-4">
                    <a href="../index.html" class="text-decoration-none">
                        <div class="fs-3 fw-bold text-white">
                            <i class="fa-solid fa-cart-flatbed-suitcase text-warning me-2"></i>Smart<span class="text-warning">Porter</span>
                        </div>
                    </a>
                    <p class="text-white-50 small mt-1">Railway Station Master & System Controller</p>
                </div>
                <div class="card admin-card shadow-lg p-4">
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <i class="fa-solid fa-shield-halved text-warning fs-4"></i>
                        <h4 class="fw-bold text-navy mb-0">Admin Console</h4>
                    </div>
                    <p class="text-muted small mb-4">Authorized railway station managers and controllers</p>
                    <form id="adminLoginForm">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Admin Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-user-shield text-muted"></i></span>
                                <input type="text" id="username" class="form-control" value="admin" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-lock text-muted"></i></span>
                                <input type="password" id="password" class="form-control" value="password123" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-sp-navy w-100 py-2 mb-3 fw-bold" id="adminBtn">
                            <i class="fa-solid fa-key me-2"></i>Authenticate as Admin
                        </button>
                    </form>
                    <div class="text-center small text-muted p-2 rounded bg-light border">
                        Default Account: <code>admin</code> / <code>password123</code>
                    </div>
                </div>
                <div class="text-center mt-3">
                    <a href="../index.html" class="text-white-50 small text-decoration-none">
                        <i class="fa-solid fa-arrow-left me-1"></i> Back to Homepage
                    </a>
                </div>
            </div>
        </div>
    </div>
    <script src="../assets/js/api.js"></script>
    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('adminBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Authenticating...';

            try {
                const res = await API.loginAdmin({
                    username: document.getElementById('username').value.trim(),
                    password: document.getElementById('password').value
                });
                showNotification('Admin authenticated! Loading operations console...', 'success');
                localStorage.setItem('sp_user', JSON.stringify({ type: 'ADMIN', data: res.data }));
                setTimeout(() => { window.location.href = '../admin/dashboard.html'; }, 600);
            } catch (err) {
                showNotification(err.message || 'Login failed', 'danger');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-key me-2"></i>Authenticate as Admin';
            }
        });
    </script>
</body>
</html>
