<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porter Registration - Smart Porter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1e0a0a 0%, #7f1d1d 100%); min-height: 100vh; }
        .reg-card { border-radius: 20px; border: none; }
        .porter-badge-lg { background: linear-gradient(135deg,#1e3a5f,#2d5f8a); color:#fff; border-radius:8px; padding:4px 12px; font-weight:700; letter-spacing:1px; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="text-center mb-4">
                    <a href="../index.html" class="text-decoration-none">
                        <div class="fs-3 fw-bold text-white">
                            <i class="fa-solid fa-cart-flatbed-suitcase text-warning me-2"></i>Smart<span class="text-warning">Porter</span>
                        </div>
                    </a>
                    <p class="text-white-50 small mt-1">Railway Sahayak / Coolie Onboarding</p>
                </div>
                <div class="card reg-card shadow-lg p-4">
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <span class="porter-badge-lg">COOLIE</span>
                        <h4 class="fw-bold text-navy mb-0">Register Porter Badge</h4>
                    </div>
                    <p class="text-muted small mb-4">Enter your official Railway Coolie badge to join the digital roster</p>
                    <form id="porterRegisterForm">
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-bold text-muted">Railway Badge Number</label>
                                <input type="text" id="badgeNumber" class="form-control text-uppercase" placeholder="e.g. CK-345" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-bold text-muted">Assigned Station</label>
                                <select id="stationId" class="form-select" required>
                                    <option value="" disabled selected>Loading stations...</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Full Name</label>
                            <input type="text" id="fullName" class="form-control" placeholder="e.g. Shyam Lal" required>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-bold text-muted">Mobile Number</label>
                                <input type="tel" id="phone" class="form-control" placeholder="10 digits" pattern="[0-9]{10}" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-bold text-muted">Email Address</label>
                                <input type="email" id="email" class="form-control" placeholder="shyam@porter.in" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted">Choose Password</label>
                            <input type="password" id="password" class="form-control" placeholder="Min 6 chars" required minlength="6">
                        </div>
                        <button type="submit" class="btn btn-danger w-100 py-2 mb-3 fw-bold shadow-sm" id="regBtn">
                            <i class="fa-solid fa-id-card me-2"></i>Register Licensed Badge
                        </button>
                    </form>
                    <div class="text-center small">
                        Already registered? <a href="porter-login.html" class="text-danger fw-bold text-decoration-none">Sign In to Duty Desk</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../assets/js/api.js"></script>
    <script>
        async function loadStations() {
            try {
                const res = await API.getStations();
                const sel = document.getElementById('stationId');
                sel.innerHTML = '';
                (res.data || []).forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.stationId;
                    opt.textContent = `${s.stationCode} - ${s.stationName}`;
                    sel.appendChild(opt);
                });
            } catch(e) {}
        }
        loadStations();

        document.getElementById('porterRegisterForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('regBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Registering Badge...';

            try {
                const badge = document.getElementById('badgeNumber').value.trim().toUpperCase();
                const res = await API.registerPorter({
                    badgeNumber: badge,
                    fullName: document.getElementById('fullName').value.trim(),
                    phone: document.getElementById('phone').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    stationId: parseInt(document.getElementById('stationId').value) || 1,
                    password: document.getElementById('password').value
                });
                showNotification(`✅ Badge ${badge} registered successfully! Redirecting to login...`, 'success');
                setTimeout(() => {
                    window.location.href = `porter-login.html?badge=${encodeURIComponent(badge)}`;
                }, 1000);
            } catch (err) {
                showNotification(err.message || 'Registration failed', 'danger');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-id-card me-2"></i>Register Licensed Badge';
            }
        });
    </script>
</body>
</html>
