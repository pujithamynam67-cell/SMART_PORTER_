<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incoming Booking Requests - Smart Porter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
    <style>
        .request-card {
            border: 2px solid #fed7aa; border-radius: 16px;
            transition: all 0.2s ease; background: #fff;
        }
        .request-card:hover {
            box-shadow: 0 8px 24px rgba(249, 115, 22, 0.18);
            transform: translateY(-2px);
        }
        .pulse-badge {
            animation: pulseBg 1.5s infinite;
        }
        @keyframes pulseBg {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg sp-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand sp-brand" href="../index.html">
                <i class="fa-solid fa-cart-flatbed-suitcase text-warning"></i>
                Smart<span>Porter</span>
                <span class="badge bg-danger ms-2 small">COOLIE DESK</span>
            </a>
            <div class="ms-auto d-flex align-items-center gap-2">
                <a href="dashboard.html" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Dashboard</a>
            </div>
        </div>
    </nav>

    <!-- Sub Navigation -->
    <div class="bg-white border-bottom py-2 shadow-sm">
        <div class="container d-flex gap-3 small fw-bold">
            <a href="dashboard.html" class="text-muted text-decoration-none py-1">Dashboard</a>
            <a href="requests.html" class="text-danger text-decoration-none py-1 border-bottom border-danger border-2">Incoming Requests</a>
            <a href="active-job.html" class="text-muted text-decoration-none py-1">Active Job</a>
            <a href="history.html" class="text-muted text-decoration-none py-1">Trip History</a>
            <a href="profile.html" class="text-muted text-decoration-none py-1">My Badge</a>
        </div>
    </div>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h4 class="fw-bold text-navy mb-0"><i class="fa-solid fa-bell text-danger me-2"></i> Station Booking Broadcasts</h4>
                <p class="text-muted small mb-0">Incoming passenger requests needing coolie luggage assistance at your station.</p>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2">
                    <i class="fa-solid fa-circle fa-2xs me-1"></i> Duty Online
                </span>
                <button class="btn btn-sm btn-outline-primary" onclick="loadRequests()">
                    <i class="fa-solid fa-arrows-rotate me-1"></i> Refresh Requests
                </button>
            </div>
        </div>

        <div id="requestsList" class="row g-3">
            <div class="col-12 text-center py-5 text-muted">
                <i class="fa-solid fa-spinner fa-spin me-2"></i> Listening for incoming station broadcasts...
            </div>
        </div>
    </div>

    <script src="../assets/js/api.js"></script>
    <script>
        let currentPorter = { porterId: 1, stationId: 1 };
        let refreshTimer = null;

        async function initRequests() {
            const raw = localStorage.getItem('sp_user');
            if (raw) {
                try {
                    const u = JSON.parse(raw);
                    if (u.type === 'PORTER' && u.data) currentPorter = u.data;
                } catch(e) {}
            }
            loadRequests();
            // Automatically poll every 2 seconds so passenger bookings show up immediately
            refreshTimer = setInterval(loadRequests, 2000);
        }

        async function loadRequests() {
            const container = document.getElementById('requestsList');
            try {
                const res = await API.getPorterRequests(currentPorter.stationId || 1);
                let reqs = res.data || [];

                // Filter only requests that are pending (REQUESTED)
                reqs = reqs.filter(b => b.bookingStatus === 'REQUESTED');

                // If no real requests, provide 1 default broadcast for demonstration
                if (reqs.length === 0) {
                    container.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <div class="rounded-circle bg-light border d-inline-flex align-items-center justify-content-center p-4 mb-3">
                                <i class="fa-solid fa-inbox fa-3x text-muted"></i>
                            </div>
                            <h5 class="fw-bold text-navy">No Pending Requests at this Moment</h5>
                            <p class="text-muted small">When a passenger creates a booking at your station, it will appear here instantly.</p>
                            <a href="../passenger/book.html" target="_blank" class="btn btn-sp-orange btn-sm">
                                <i class="fa-solid fa-plus-circle me-1"></i> Create a Test Booking as Passenger
                            </a>
                        </div>`;
                    return;
                }

                container.innerHTML = '';
                reqs.forEach(r => {
                    const col = document.createElement('div');
                    col.className = 'col-md-6';
                    col.innerHTML = `
                        <div class="request-card p-4 h-100 shadow-sm">
                            <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
                                <div>
                                    <span class="badge bg-danger pulse-badge me-1">NEW REQUEST</span>
                                    <strong class="text-navy fs-5">${r.bookingCode}</strong>
                                </div>
                                <span class="badge bg-success fs-5 px-3 py-2">₹${Number(r.totalAmount||0).toFixed(2)}</span>
                            </div>
                            <div class="small mb-3">
                                <div class="mb-2">
                                    <span class="text-muted">Passenger:</span> 
                                    <strong class="text-navy fs-6">${r.passengerName || 'Rajesh Sharma'}</strong> 
                                    <span class="text-muted">(${r.passengerPhone || '9811002233'})</span>
                                </div>
                                <div class="mb-2 p-2 rounded bg-light border">
                                    <div><i class="fa-solid fa-circle-dot text-success me-1"></i> Pickup: <strong>${r.pickupLocationName || 'Station Gate 1'}</strong></div>
                                    <div><i class="fa-solid fa-location-dot text-danger me-1"></i> Drop: <strong>${r.dropLocationName || 'Platform 1 Departure Bay'}</strong></div>
                                </div>
                                <div class="mb-1"><span class="text-muted">Train / Coach:</span> <strong>${r.trainNumber ? `${r.trainNumber} (Coach ${r.coachNumber || 'B1'}, Seat ${r.seatNumber || '25'})` : 'Station Boarding'}</strong></div>
                                <div class="mb-1"><span class="text-muted">Luggage:</span> <strong>${r.luggage ? `${r.luggage.bagCount || 1}x ${r.luggage.category || 'Trolley Case'} (${r.luggage.weightKg || 15} kg)` : 'Standard baggage'}</strong></div>
                                ${r.luggage && r.luggage.specialInstructions ? `<div class="text-danger small mt-1"><i class="fa-solid fa-circle-exclamation me-1"></i>Note: ${r.luggage.specialInstructions}</div>` : ''}
                            </div>
                            <div class="d-flex gap-2 mt-auto">
                                <button class="btn btn-success flex-grow-1 py-2 fw-bold shadow-sm" onclick="acceptBooking(${r.bookingId})">
                                    <i class="fa-solid fa-check-circle me-1"></i> Accept Job (Assign to Me)
                                </button>
                            </div>
                        </div>
                    `;
                    container.appendChild(col);
                });
            } catch(e) {
                container.innerHTML = `<div class="col-12 text-center text-danger py-4">${e.message}</div>`;
            }
        }

        async function acceptBooking(bookingId) {
            try {
                await API.porterAcceptBooking(bookingId, currentPorter.porterId);
                showNotification('Job accepted! You are now assigned to this passenger.', 'success');
                setTimeout(() => {
                    window.location.href = `active-job.html?id=${bookingId}`;
                }, 600);
            } catch(e) {
                showNotification(e.message || 'Could not accept booking', 'danger');
            }
        }

        initRequests();
    </script>
</body>
</html>
