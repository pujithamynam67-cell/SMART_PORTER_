<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Profile - Smart Porter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg sp-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand sp-brand" href="../index.html">
                <i class="fa-solid fa-cart-flatbed-suitcase text-warning"></i>
                Smart<span>Porter</span>
            </a>
            <div class="ms-auto d-flex align-items-center gap-2">
                <a href="dashboard.html" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4 border-0 shadow-sm rounded-4">
                    <div class="d-flex align-items-center gap-3 mb-4">
                        <div class="rounded-circle bg-warning text-dark fw-bold d-flex align-items-center justify-content-center" style="width: 56px; height: 56px; font-size: 1.5rem;" id="avatarInitial">
                            P
                        </div>
                        <div>
                            <h4 class="fw-bold text-navy mb-0" id="profTitleName">Passenger Profile</h4>
                            <span class="badge bg-success-subtle text-success border border-success-subtle">Verified IRCTC Passenger</span>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Full Name</label>
                        <input type="text" id="profName" class="form-control" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Registered Phone</label>
                        <input type="text" id="profPhone" class="form-control" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Email Address</label>
                        <input type="text" id="profEmail" class="form-control" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Senior Citizen Subsidy</label>
                        <input type="text" id="profSenior" class="form-control" readonly>
                    </div>
                    <div class="border-top pt-3 text-muted small d-flex justify-content-between align-items-center">
                        <span>Profile registered under IRCTC Digital Coolie Mobility</span>
                        <a href="book.html" class="btn btn-sp-orange btn-sm fw-bold">Book a Porter</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const raw = localStorage.getItem('sp_user');
        if (raw) {
            try {
                const u = JSON.parse(raw);
                if (u.data) {
                    const name = u.data.fullName || 'Rajesh Sharma';
                    document.getElementById('profTitleName').textContent = name;
                    document.getElementById('avatarInitial').textContent = name.charAt(0).toUpperCase();
                    document.getElementById('profName').value = name;
                    document.getElementById('profPhone').value = u.data.phone || '9811002233';
                    document.getElementById('profEmail').value = u.data.email || 'rajesh@example.com';
                    document.getElementById('profSenior').value = u.data.isSeniorCitizen ? 'Yes (15% Concession Enabled)' : 'Standard (No Concession)';
                }
            } catch(e) {}
        }
    </script>
</body>
</html>
